name: Sync fork with upstream

on:
  schedule:
    # Every 3 days at 05:17 UTC (odd minute to dodge cron peak load).
    # Note: day-of-month */3 restarts each month, so the 31st -> 1st gap is 1 day.
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/bjarneo/aether.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream into fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          local_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse "upstream/$UPSTREAM_BRANCH")

          if git merge-base --is-ancestor "$upstream_sha" "$local_sha"; then
            echo "Already contains upstream/$UPSTREAM_BRANCH ($upstream_sha); nothing to do."
            exit 0
          fi

          # Fast-forward when the fork has no commits of its own; otherwise a
          # real merge commit, which keeps fork-only files (this workflow).
          if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "::error::Merge conflict with upstream/$UPSTREAM_BRANCH. Resolve manually:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

          git push origin "HEAD:$TARGET_BRANCH"
          echo "Synced $local_sha -> $(git rev-parse HEAD) (upstream $upstream_sha)"

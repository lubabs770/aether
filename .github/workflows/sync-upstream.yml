name: Sync fork with upstream

on:
  schedule:
    # Every 3 days at 05:17 UTC (odd minute to dodge cron peak load).
    # Note: day-of-month */3 restarts each month, so the 31st -> 1st gap is 1 day.
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/bjarneo/aether.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream into fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          local_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse "upstream/$UPSTREAM_BRANCH")

          if git merge-base --is-ancestor "$upstream_sha" "$local_sha"; then
            echo "Already contains upstream/$UPSTREAM_BRANCH ($upstream_sha); nothing to do."
            exit 0
          fi

          # Always a real merge commit (never a fast-forward): the workflow
          # fixup below has to land in the same commit as the merge.
          if ! git merge --no-commit --no-ff "upstream/$UPSTREAM_BRANCH"; then
            unmerged=$(git diff --name-only --diff-filter=U)
            outside=$(printf '%s\n' "$unmerged" | grep -v '^\.github/workflows/' || true)
            if [ -n "$outside" ]; then
              echo "::error::Merge conflict with upstream/$UPSTREAM_BRANCH. Resolve manually:"
              printf '%s\n' "$outside"
              git merge --abort
              exit 1
            fi
            echo "Conflicts confined to .github/workflows/; keeping the fork's copies."
          fi

          # GITHUB_TOKEN has no `workflow` scope, so a push that touches
          # .github/workflows is rejected outright ("refusing to allow a GitHub
          # App to create or update workflow ... without `workflows`
          # permission"). Drop upstream's workflow changes from the merge and
          # keep the fork's own files verbatim; the fork does not want to run
          # upstream's release/AUR jobs anyway.
          git rm -r -q --cached --ignore-unmatch .github/workflows >/dev/null
          rm -rf .github/workflows
          git checkout "$local_sha" -- .github/workflows

          git commit --no-edit

          git push origin "HEAD:$TARGET_BRANCH"
          echo "Synced $local_sha -> $(git rev-parse HEAD) (upstream $upstream_sha)"
